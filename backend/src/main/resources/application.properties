# Application Configuration
spring.application.name=peer-tutoring-backend
server.port=8080

# Database Configuration (H2 for testing)
spring.datasource.url=jdbc:h2:mem:peer_tutoring
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console (enable for development)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# JWT Configuration
jwt.secret=peerTutoringSecretKey2026PeerTutoringPlatformBITSAssignment
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002

# OAuth2 Configuration
# Set oauth2.enabled=true and provide client credentials to enable OAuth2
oauth2.enabled=false

# Google OAuth2 - Replace with your actual credentials or set as environment variables
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/auth/oauth2/callback/{registrationId}

# GitHub OAuth2 - Replace with your actual credentials or set as environment variables
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/api/auth/oauth2/callback/{registrationId}

# OAuth2 Redirect URI
app.oauth2.authorized-redirect-uris=http://localhost:3000/oauth2/redirect

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.tutoring=DEBUG
